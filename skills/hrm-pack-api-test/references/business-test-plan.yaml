          # deleted without relying on system-user unlink privileges.
          - {id: cleanup_to_draft, path: Resignation Letter/app_btn_to_draft.bru, expected: {http_status: [200], state_change: true}}
          - {id: cleanup_delete, path: Resignation Letter/app_delete_resignation_letter.bru, expected: {http_status: [200], state_change: true}}
      - id: reject
        steps:
          - {id: reject, path: Resignation Letter/app_approval_reject.bru, expected: {http_status: [200], state_change: true}}
    excluded:
      - {path: Resignation Letter/app_btn_cancel.bru, reason: alternate destructive workflow}

