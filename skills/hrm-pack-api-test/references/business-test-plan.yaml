    purpose: Create a resignation letter and verify one approval outcome.
    safety: stateful
    preconditions:
      - Departure reason exists.
      - The current employee has an onboard date; the helper request updates it before resignation creation.
      - Employee/date/day-off data satisfy duplicate and date constraints.
      - Approval template and authorized approver exist.
    fixture_policy: create_then_capture_resignation_id
    steps:
      - {id: employee_onboard_date, path: HR Employee/update_employee_onboard_time.bru, mode: required, expected: {http_status: [200]}}
      - {id: departure_reasons, path: Resignation Letter/get_infor_departure_reason.bru, mode: required, expected: {http_status: [200]}}
      - {id: create_resignation, path: Resignation Letter/create_or_update_resignation_letter.bru, mode: required, fixture_required: true, expected: {http_status: [200], captures: [resignation_id], body_fields_any: [id, data.id]}}
      - {id: details, path: Resignation Letter/get_resignation_letter_details.bru, mode: required, expected: {http_status: [200], response_present: true}}
      - {id: list, path: Resignation Letter/get_resignation_letter.bru, mode: optional, fixture_required: true, expected: {http_status: [200]}}
      - {id: attachment, path: Resignation Letter/upload_attachment_file.bru, mode: optional, safety: upload, expected: {http_status: [200]}}
      - {id: submit, path: Resignation Letter/app_approval_submit.bru, mode: required, expected: {http_status: [200], state_change: true}}
    alternatives:
      - id: approve
        steps:
          - {id: accept, path: Resignation Letter/app_approval_accept.bru, expected: {http_status: [200], state_change: true}}
          # Approval changes the employee state only when day_off is today or
