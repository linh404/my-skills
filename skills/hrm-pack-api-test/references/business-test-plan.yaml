schema_version: 1
name: hrm-pack-api-business-tests
description: >-
  Source-backed, dependency-ordered business checks for the KG Odoo HRM Bruno
  collection. Each business is executed in its own Bruno process/session.
collection: /home/linh/Workspace/my-skills/skills/hrm-pack-api-test/collection
execution_defaults:
  auth_step: Authentication & System/login.bru
  stop_on_failure: true
  include_optional: false
  mutation_policy: explicit_opt_in
  fixture_policy: explicit_confirmation
  full_collection_policy: references/full-collection-lifecycle-rules.md
  success_requires:
    - bruno_status_pass
    - expected_http_status
    - declared_business_checks_reviewed
  report_fields:
    - business
    - step
    - status
    - http_status
    - checks
    - checkpoint

# A step is a collection-relative .bru path. `required` steps are the normal
# happy path. `optional` steps need explicit opt-in. `manual` steps remain
# operator-managed only when no runtime producer mapping exists; a canonical
# manual step with a mapped producer chain is executed by the runner. Alias
# paths remain deferred regardless of the flags passed to the runner.
lifecycle_rules:
  fresh_resource_for_destructive:
    - create the record in the same run
    - capture its ID with bru.setVar
    - execute delete/cancel/reset/reject against that ID
    - verify the final state and cleanup result
  account_delete:
    - sign_up with unique generated credentials
    - verify/login the newly created account
    - delete only that new account
    - never delete the configured operator/admin account
  employee_documents:
    - upload a non-sensitive placeholder for the designated test employee
    - capture the returned attachment ID
    - verify then delete that exact attachment
  runtime_dependencies:
    rule: producer_before_consumer
    requirements:
      - every detail/workflow/attachment/delete step must have a producer step
      - call the producer before the consumer in the same Bruno process
      - capture the producer ID with bru.setVar and pass that runtime variable forward
      - unresolved variables and hardcoded historical IDs are mapping defects
      - if the producer cannot return a valid ID, classify the consumer as fixture_unavailable
  aliases:
    status: deferred
    action:
      - leave aliases in place
      - do not rename or rewrite aliases in this phase
      - do not execute aliases in this phase
      - do not count aliases as tested business coverage

# The runner uses this map at execution time.  A consumer is never sent by
# itself: every producer listed here is inserted immediately before it (and
# its own producers are inserted recursively).  The Bruno response scripts in
# the canonical producer requests populate the runtime variables consumed by
# the following requests.  Alias files are deliberately absent from this map.
