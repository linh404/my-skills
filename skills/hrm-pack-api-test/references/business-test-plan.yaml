businesses:
  - id: authentication
    title: Authentication and session
    flow: authentication
    purpose: Verify login, bearer token capture, and Odoo session cookie setup.
    safety: session_only
    preconditions:
      - Environment contains valid user, password, and database values.
    steps:
      - id: login
        path: Authentication & System/login.bru
        mode: required
        expected:
          http_status: [200]
          body_fields_any: [token, access_token, data.token]
          captures: [token]
      - id: update_device_token
        path: Authentication & System/update_device_token.bru
        mode: optional
        safety: update
        fixture_required: true
        fixture_fields: [employee_id]
        expected:
          http_status: [200]
    excluded:
      - path: Authentication & System/app_change_password.bru
        reason: destructive account mutation; never part of a smoke test
      - path: Authentication & System/app_delete_account.bru
        reason: destructive account deletion
      - path: Authentication & System/forgot_password.bru
        reason: sends an external recovery side effect
      - path: Authentication & System/sign_up.bru
        reason: creates a user and requires unique operator data

  - id: reference_data
    title: Reference and master data
    flow: reference_data
    purpose: Verify read-only values needed to populate HR transactions.
    safety: read_only
    preconditions:
      - Login succeeds.
      - Target database contains the relevant company and HR master data.
    steps:
      - {id: company_banners, path: Company & Users/get_company_banners.bru, mode: required, expected: {http_status: [200]}}
      - {id: login_logo, path: Company & Users/login_logo.bru, mode: required, expected: {http_status: [200]}}
      - {id: contract_info, path: HR Contract & Job/get_contract_infor.bru, mode: required, expected: {http_status: [200]}}
      - {id: calendar, path: HR Contract & Job/get_infor_calendar.bru, mode: required, expected: {http_status: [200], response_present: true}}
      - {id: departments, path: HR Contract & Job/get_infor_employee_department.bru, mode: required, expected: {http_status: [200]}}
      - {id: divisions, path: HR Contract & Job/get_infor_employee_division.bru, mode: required, expected: {http_status: [200]}}
      - {id: groups, path: HR Contract & Job/get_infor_employee_group.bru, mode: required, expected: {http_status: [200]}}
      - {id: jobs, path: HR Contract & Job/get_infor_job.bru, mode: required, expected: {http_status: [200]}}

  - id: employee_context
    title: Current employee context
    flow: employee_context
    purpose: Verify the authenticated user's employee, profile, organization, and approval context.
    safety: read_only
    preconditions:
      - Login succeeds.
      - Authenticated user is linked to an hr.employee record.
    steps:
      - {id: current_employee, path: HR Employee/1.bru, mode: required, expected: {http_status: [200], response_present: true}}
      - {id: employee_info, path: HR Employee/get_employee_infor.bru, mode: required, expected: {http_status: [200]}}
      - {id: employee_list, path: HR Employee/get_list_employee_infor.bru, mode: required, expected: {http_status: [200]}}
      - {id: org_chart, path: HR Employee/get_org_chart.bru, mode: required, expected: {http_status: [200]}}
      - {id: pending_count, path: HR Employee/get_pending_approvals_count_only.bru, mode: required, expected: {http_status: [200]}}
      - {id: pending_approvals, path: HR Employee/get_all_pending_approvals_mobile.bru, mode: required, expected: {http_status: [200]}}
      - {id: approval_info, path: HR Employee/get_approval_infor.bru, mode: optional, fixture_required: true, expected: {http_status: [200]}}
      - {id: health_insurance, path: HR Employee/get_employee_health_insurance.bru, mode: required, expected: {http_status: [200]}}
      - {id: social_insurance, path: HR Employee/get_employee_social_insurance.bru, mode: required, expected: {http_status: [200]}}
      - {id: taxes, path: HR Employee/get_employee_taxes.bru, mode: required, expected: {http_status: [200]}}
      - {id: profile_attachments, path: HR Employee/get_employee_profile_attachments.bru, mode: required, expected: {http_status: [200]}}
      - {id: company_attachments, path: HR Employee/get_company_profile_attachments.bru, mode: required, expected: {http_status: [200]}}

  - id: employee_documents
    title: Employee document upload and deletion
    flow: employee_context
    purpose: Upload each employee document and delete the exact attachment returned by that upload.
    safety: destructive_cleanup
    preconditions:
      - Login succeeds and current employee context returns employee_id.
      - The collection placeholder file exists.
    steps:
      - {id: upload_birth_certificate, path: HR Employee/upload_birth_certificate.bru, mode: required, expected: {http_status: [200], captures: [employee_birth_certificate_attachment_id]}}
      - {id: delete_birth_certificate, path: HR Employee/delete_birth_certificate_file.bru, mode: required, expected: {http_status: [200]}}
      - {id: upload_citizen_id, path: HR Employee/upload_citizen_id.bru, mode: required, expected: {http_status: [200], captures: [employee_citizen_id_attachment_id]}}
      - {id: delete_citizen_id, path: HR Employee/delete_citizen_id_card_file.bru, mode: required, expected: {http_status: [200]}}
      - {id: upload_curriculum_vitae, path: HR Employee/upload_curriculum_vitae.bru, mode: required, expected: {http_status: [200], captures: [employee_curriculum_vitae_attachment_id]}}
      - {id: delete_curriculum_vitae, path: HR Employee/delete_curriculum_vitae_file.bru, mode: required, expected: {http_status: [200]}}
      - {id: upload_cv_file, path: HR Employee/upload_cv_file.bru, mode: required, expected: {http_status: [200], captures: [employee_cv_file_attachment_id]}}
      - {id: delete_cv_file, path: HR Employee/delete_cv_file_file.bru, mode: required, expected: {http_status: [200]}}
      - {id: upload_diploma, path: HR Employee/upload_diploma.bru, mode: required, expected: {http_status: [200], captures: [employee_diploma_attachment_id]}}
      - {id: delete_diploma, path: HR Employee/delete_diploma_file.bru, mode: required, expected: {http_status: [200]}}
      - {id: upload_employee_other_document, path: HR Employee/upload_employee_other_document.bru, mode: required, expected: {http_status: [200], captures: [employee_employee_other_document_attachment_id]}}
      - {id: delete_employee_other_document, path: HR Employee/delete_employee_other_document_file.bru, mode: required, expected: {http_status: [200]}}
      - {id: upload_health_check, path: HR Employee/upload_health_check.bru, mode: required, expected: {http_status: [200], captures: [employee_health_check_attachment_id]}}
      - {id: delete_health_check, path: HR Employee/delete_health_check_file.bru, mode: required, expected: {http_status: [200]}}
      - {id: upload_personnel_guarantee_letter, path: HR Employee/upload_personnel_guarantee_letter.bru, mode: required, expected: {http_status: [200], captures: [employee_personnel_guarantee_letter_attachment_id]}}
      - {id: delete_personnel_guarantee_letter, path: HR Employee/delete_personnel_guarantee_letter_file.bru, mode: required, expected: {http_status: [200]}}
      - {id: upload_residence_certificate, path: HR Employee/upload_residence_certificate.bru, mode: required, expected: {http_status: [200], captures: [employee_residence_certificate_attachment_id]}}
      - {id: delete_residence_certificate, path: HR Employee/delete_residence_certificate_file.bru, mode: required, expected: {http_status: [200]}}
      - {id: upload_staff_confirmation_letter, path: HR Employee/upload_staff_confirmation_letter.bru, mode: required, expected: {http_status: [200], captures: [employee_staff_confirmation_letter_attachment_id]}}
      - {id: delete_staff_confirmation_letter, path: HR Employee/delete_staff_confirmation_letter_file.bru, mode: required, expected: {http_status: [200]}}

  - id: leave
    title: Leave request lifecycle
    flow: leave
    purpose: Resolve leave type, create a leave, inspect it, and verify one approval outcome.
    safety: stateful
    preconditions:
      - Login and employee context succeed.
      - A valid leave type, quota, date range, and approval configuration exist.
      - User has permission to submit and the selected approver can act.
    fixture_policy: generated_future_weekday_then_capture_leave_id
    date_policy: The leave pre-request script generates one random weekday 3-45 days in the future and reuses it for the availability lookup and create request.
    steps:
      - {id: leave_type, path: HR Leave & Overtime/get_holiday_status_id_and_days.bru, mode: required, expected: {http_status: [200], response_present: true}}
      - {id: create_leave, path: HR Leave & Overtime/create_or_update_hr_leave.bru, mode: required, expected: {http_status: [200], captures: [leave_id], body_fields_any: [id, data.id]}}
      - {id: leave_details, path: HR Leave & Overtime/get_hr_leave_details.bru, mode: required, expected: {http_status: [200], response_present: true}}
      - {id: leave_list, path: HR Leave & Overtime/get_list_leaves.bru, mode: required, expected: {http_status: [200]}}
      - {id: leave_attachment, path: HR Leave & Overtime/attach_files.bru, mode: optional, safety: upload, expected: {http_status: [200]}}
      - {id: submit, path: HR Leave & Overtime/app_approval_submit.bru, mode: required, expected: {http_status: [200], state_change: true}}
    alternatives:
      - id: approve
        steps:
          - {id: accept, path: HR Leave & Overtime/app_approval_accept.bru, expected: {http_status: [200], state_in: [approved, validate, validated]}}
      - id: reject
        steps:
          - {id: reject, path: HR Leave & Overtime/app_approval_reject.bru, expected: {http_status: [200], state_in: [refused, rejected]}}
    final_checks:
      - {id: approval_progress, path: HR Leave & Overtime/get_hr_leave_approval_progress.bru, mode: required, expected: {http_status: [200], response_present: true}}
    excluded:
      - {path: HR Leave & Overtime/app_delete_hr_leave.bru, reason: destructive cleanup; run only with explicit approval}
      - {path: HR Leave & Overtime/app_approval_set_to_cancel.bru, reason: alternate destructive workflow}
      - {path: HR Leave & Overtime/app_approval_set_to_draft.bru, reason: alternate state reset}

  - id: overtime
    title: Overtime request lifecycle
    flow: leave
    purpose: Resolve overtime type, create an overtime request, and verify its workflow outcome.
    safety: stateful
    preconditions:
      - Login and employee context succeed.
      - Overtime type exists and request dates are on the same day.
      - Approval template and authorized approver exist.
    fixture_policy: create_then_capture_overtime_id
    steps:
      - {id: overtime_type, path: HR Leave & Overtime/get_overtime_holiday_status_id.bru, mode: required, expected: {http_status: [200], response_present: true}}
      - {id: create_overtime, path: HR Leave & Overtime/create_or_update_overtime_register.bru, mode: required, fixture_required: true, expected: {http_status: [200], captures: [overtime_id], body_fields_any: [id, data.id]}}
      - {id: overtime_details, path: HR Leave & Overtime/get_overtime_register_details.bru, mode: manual, fixture_required: true, expected: {http_status: [200], response_present: true}}
      - {id: overtime_list, path: HR Leave & Overtime/get_list_overtime_register.bru, mode: required, expected: {http_status: [200]}}
      - {id: submit, path: HR Leave & Overtime/app_approval_submit_2.bru, mode: manual, fixture_required: true, expected: {http_status: [200], state_change: true}}
    alternatives:
      - id: approve
        steps:
          - {id: accept, path: HR Leave & Overtime/app_approval_accept_2.bru, mode: manual, fixture_required: true, expected: {http_status: [200], state_change: true}}
      - id: reject
        steps:
          - {id: reject, path: HR Leave & Overtime/app_approval_reject_2.bru, mode: manual, fixture_required: true, expected: {http_status: [200], state_change: true}}
    excluded:
      - {path: HR Leave & Overtime/app_delete_overtime_register.bru, reason: destructive cleanup}
    notes:
      - The overtime detail and JSON-2 approval aliases still contain literal IDs (8150/31) instead of overtime_id. They remain manual until the collection is corrected; the create step's captured overtime_id is not used by those aliases.

  - id: attendance_explanation
    title: Attendance explanation lifecycle
    flow: attendance_explanation
    purpose: Create an attendance explanation, optionally attach evidence, and verify approval.
    safety: stateful
    preconditions:
      - Login succeeds and user maps to an employee.
      - Explanation reason, day type, allocation, and calendar are configured.
      - No existing explanation conflicts with the employee/date unique constraint.
    fixture_policy: create_then_capture_explanation_id
    steps:
      - {id: reasons, path: HR Attendance Explanation/get_infor_explanation_reason.bru, mode: required, expected: {http_status: [200]}}
      - {id: day_types, path: HR Attendance Explanation/get_infor_day_type.bru, mode: required, expected: {http_status: [200]}}
      - {id: allocations, path: HR Attendance Explanation/get_infor_allocation.bru, mode: required, expected: {http_status: [200]}}
      - {id: create_explanation, path: HR Attendance Explanation/create_or_update_explanation.bru, mode: required, fixture_required: true, expected: {http_status: [200], captures: [explanation_id], body_fields_any: [id, data.id]}}
